name: Validate Stock Dashboard

on:
  push:
    branches: [main, master]
  paths:
    - '**.py'
    - 'requirements.txt'
    - '.github/workflows/validate.yml'
  pull_request:

jobs:
  syntax-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile python3.py
      - name: Verify imports
        run: python -c "import streamlit, yfinance, pandas, plotly, ta, streamlit_autorefresh, numpy, sklearn; print('All imports successful')"
